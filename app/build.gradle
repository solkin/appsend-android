plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) localPropertiesFile.withInputStream { localProperties.load(it) }

def signingSetting = { String name ->
    def value = project.findProperty(name) ?: localProperties.getProperty(name) ?: System.getenv(name)
    return value ? value.toString() : null
}

def releaseSigning = [
    store: signingSetting('APPSEND_KEYSTORE'),
    storePassword: signingSetting('APPSEND_KEYSTORE_PASSWORD'),
    alias: signingSetting('APPSEND_KEY_ALIAS'),
    keyPassword: signingSetting('APPSEND_KEY_PASSWORD'),
]
if (releaseSigning.values().any { !it } || !rootProject.file(releaseSigning.store).exists()) {
    releaseSigning = null
}

android {
    // The release key, when whoever is building has one. Read from Gradle properties,
    // local.properties or the environment, never from the repository. Without it the
    // release build still assembles, unsigned, which is all a check of the build wants.
    if (releaseSigning != null) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseSigning.store)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.alias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    compileSdk = 36
    namespace = "com.tomclaw.appsend_rb"
    defaultConfig {
        applicationId "com.tomclaw.appsend_rb"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode = project.hasProperty("versionCode") ? Integer.parseInt(project.versionCode) : 98
        versionName = "5.0"
        multiDexEnabled true
        manifestPlaceholders = [
                BANANALYTICS_BASE_URL: "https://bnn.citron.dev",
                BANANALYTICS_API_KEY  : "bnn_cgQm4fq6Ze1NCBJ9ldJEUSrnO0JrujmV"
        ]
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            shrinkResources = false
            jniDebuggable true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
        release {
            minifyEnabled true
            debuggable false
            shrinkResources = true
            jniDebuggable false
            signingConfig = signingConfigs.findByName("release")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    lint {
        abortOnError = false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.solkin:bananalytics-android:1.0.0'
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'
    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.1'
    implementation 'com.google.dagger:dagger:2.58'
    kapt 'com.google.dagger:dagger-compiler:2.58'
    kapt 'org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0'
    testImplementation 'junit:junit:4.13.2'
}
repositories {
    mavenCentral()
}
