plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
}

android {
    signingConfigs {
        release {
            if (project.hasProperty("storeFile")) storeFile file("$rootDir/" + project.storeFile)
            if (project.hasProperty("storePassword")) storePassword project.storePassword
            if (project.hasProperty("keyAlias")) keyAlias project.keyAlias
            if (project.hasProperty("keyPassword")) keyPassword project.keyPassword
        }
    }
    compileSdk = 36
    namespace = "com.tomclaw.appsend_rb"
    defaultConfig {
        applicationId "com.tomclaw.appsend_rb"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode = project.hasProperty("versionCode") ? Integer.parseInt(project.versionCode) : 92
        versionName = "4.0"
        multiDexEnabled true
        manifestPlaceholders = [
                BANANALYTICS_BASE_URL: "https://bnn.citron.dev",
                BANANALYTICS_API_KEY  : "bnn_cgQm4fq6Ze1NCBJ9ldJEUSrnO0JrujmV"
        ]
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            shrinkResources = false
            jniDebuggable true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
        release {
            minifyEnabled true
            debuggable false
            shrinkResources = true
            jniDebuggable false
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    lint {
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.github.solkin:knopochki-android:0.1.0'
    implementation 'com.github.solkin:bananalytics-android:1.0.0'
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'
    implementation 'io.reactivex.rxjava3:rxkotlin:3.0.1'
    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.1'
    implementation 'com.google.dagger:dagger:2.58'
    kapt 'com.google.dagger:dagger-compiler:2.58'
    kapt 'org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0'
}
repositories {
    mavenCentral()
}
